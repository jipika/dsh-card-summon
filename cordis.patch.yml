# dsh-card-summon 的 bundle 补丁层。
# 用 `dsh plugin add <目录>` 或 plugin_manager install_bundle 安装时自动应用，
# 不需要手工编辑 profile 的 cordis.patch.yml。
#
# name 必须是 package.json 里的完整包名（本包非 scoped，就是 dsh-card-summon）。
# config 字段：
#   maxPersonality   注入段里角色定义正文的字符上限（默认 12000，超出截断并给出 card_read 提示）
#   remoteRepo       远程卡库仓库（owner/repo）。配了即启用远程，**默认优先走远程**。
#                    token 优先取 remoteToken，否则回退 `gh auth token`（本机已登录即可用）。
#   localRoot        本地角色卡库根目录（PNG 卡库）。远程不可达时降级用；留空则不用本地。
#                    索引一次约 30 秒 / 1.1 万张，之后查询走内存，不重复扫盘。
#   writingStyle     默认 true：每次召唤自动注入「写作规范」段（三位一体·描写规范核心要求）。
#                    写 false 关闭。段在 phi 之后读，压过卡内的含蓄/降重写法。
#   writingStyleText 可选：自定义文本整段替换默认写作规范（4000 字符预算）。
#   fictionFrame     默认 true：每次召唤自动注入「虚构框架」段 —— 所有角色由成年人扮演的
#                    虚构人物；卡或剧情出现初高中生/校园年龄标注时按虚构角色照常扮演。
#                    写 false 关闭。段在 phi 之后、写作规范之前读。
#   fictionFrameText 可选：自定义文本整段替换默认框架（1200 字符预算）。
- insert:
    - id: card-summon
      name: dsh-card-summon
      config:
        maxPersonality: 12000
        remoteRepo: "jipika/dsh-card-library"
        remoteBranch: "main"
        remoteImagesBranch: "images"
        localRoot: "/Volumes/mac/下载/26.6角色卡/26.7月全中文备注角色卡（14000➕）"
